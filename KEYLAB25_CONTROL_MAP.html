<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIMISS / Original KeyLab25 MIDI Map</title><style>body{margin:0;background:#070d0a;color:#d7e4dc;font:13px system-ui,sans-serif;padding:12px}#reference{max-width:1500px;margin:auto}#reference .mamb-controller-map{width:100%;max-height:none}button{padding:9px;background:#1b3628;border:1px solid #527663;color:#e1ece5}#connection{display:flex;align-items:center;gap:14px;margin:0 auto 12px;max-width:1500px}</style></head><body><div id="connection"><button id="enable-midi">ENABLE MIDI INPUT</button><span id="midi-status">Reference only — no synthesizer audio. Open mAMB to hear mapped parameters.</span></div><main id="reference"></main><script>/* Original KeyLab 25 hardware inventory. Model confirmed by owner; MIDI preset

function renderMambMidiMarkdown(state){

  text+='**Native performance paths:** notes/velocity, pitch bend ±2 semitones, CC1 modulation source and CC64 source-scoped sustain remain active independently of learned extra assignments. Clearing a learned extra does not disable these paths. CC7 → Master is a configurable software default, based on the documented Volume factory message; hardware presets may override that message. Clearing Volume disables that configurable default until RESTORE DEFAULT MAP.\n\n';

let storage;try{storage=localStorage}catch{}const registry=createMambMidiRegistry({targets:MAMB_MIDI_TARGETS,storage});window.mambMidiRegistry=registry;const map=createMambControllerMap({registry,targets:MAMB_MIDI_TARGETS,onClose:()=>{document.getElementById('midi-status').textContent='This standalone reference can be closed using the browser tab.'}});document.getElementById('reference').append(map.element);
function packet(event,deviceId){const [status,a=0,b=0]=event.data,command=status&240;if(status>=240)return;const base={deviceId,channel:status&15,origin:event.isTrusted?'hardware':'synthetic'};if(command===176)registry.receive({...base,type:'cc',number:a,value:b});else if(command===224)registry.receive({...base,type:'pitchbend',number:null,value:((b<<7|a)-8192)/8192});else if(command===144||command===128)registry.receive({...base,type:'note',number:a,value:command===128?0:b});else if(command===192)registry.receive({...base,type:'program',number:a,value:a})}
document.getElementById('enable-midi').onclick=async()=>{try{if(!navigator.requestMIDIAccess)throw new Error('Web MIDI is unavailable in this browser');const access=await navigator.requestMIDIAccess();function bind(){for(const input of access.inputs.values())input.onmidimessage=event=>packet(event,input.id);document.getElementById('midi-status').textContent=access.inputs.size+' MIDI input(s) available. No hardware activity is claimed until a real event arrives.'}bind();access.onstatechange=bind}catch(error){document.getElementById('midi-status').textContent=error.message}};
